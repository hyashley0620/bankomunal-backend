# ─── Servidor ────────
server.port=8080

# ─── Base de datos ────────────
spring.datasource.url=jdbc:mysql://localhost:3306/bankomunal?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
# CAMBIA ESTO: pon tu contraseña de MySQL
spring.datasource.password=TU_CONTRASEÑA_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ──────────────
jwt.secret=bankomunal-super-secret-key-256-bits-segura-2025
jwt.expiration-ms=86400000

# ─── CORS ─────────────────
cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,file://

# ─── Multipart (subida de archivos) ─────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# ─── Correo electrónico (Gmail) ───────────────────────────────────────────────
# Para activar: reemplaza con tu correo Gmail y contraseña de aplicación de 16 caracteres
# (Cuenta Google → Seguridad → Contraseñas de aplicación — requiere 2FA activo)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tucorreo@gmail.com
spring.mail.password=xxxx-xxxx-xxxx-xxxx
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ─── URL del frontend ─────────────
# Usada en los correos de recuperación de contraseña (enlace reset-password.html)
app.frontend-url=http://127.0.0.1:5500

# ─── Scheduling (cierre automático de encuestas) ───────────
spring.task.scheduling.enabled=true

# ─── Respaldo y Recuperación ────────────────────────────────────────────────
# Carpeta donde se guardan los dumps (.sql / .sql.enc). Se crea sola si no existe.
backup.directorio=./backups
# Rutas de las herramientas de MySQL usadas para respaldar/restaurar.
# Si mysqldump/mysql NO están en el PATH del sistema (típico en XAMPP en
# Windows), poner aquí la ruta completa, por ejemplo:
# backup.mysqldump-path=C:/xampp/mysql/bin/mysqldump.exe
# backup.mysql-path=C:/xampp/mysql/bin/mysql.exe
backup.mysqldump-path=C:/Program Files/MySQL/MySQL Server 8.4/bin/mysqldump.exe
backup.mysql-path=C:/Program Files/MySQL/MySQL Server 8.4/bin/mysql.exe
# Cuota de almacenamiento mostrada en el panel (solo referencia visual).
backup.storage-quota-mb=5120
# Llave para cifrar los respaldos en reposo (AES-256-GCM). Si se deja vacía,
# los respaldos se guardan SIN cifrar (el panel lo muestra honestamente).
# CAMBIAR ESTO por una frase larga y secreta antes de usar en producción.
backup.encryption-key=bankomunal-sena-2026

# ─── Logging ────────────────────
logging.level.com.bankomunal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=DEBUG
