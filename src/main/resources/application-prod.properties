# ─────────────────────────────────────────────────────────────────────────
# Perfil de PRODUCCIÓN (Render + Aiven)
# Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod
# Todo lo que NO se sobreescribe aquí sigue tomando el valor de
# application.properties (por eso este archivo es corto).
# ─────────────────────────────────────────────────────────────────────────

# ─── Base de datos (Aiven) ─────────────────────────────
# DB_URL debe tener el formato:
# jdbc:mysql://<HOST>:<PUERTO>/bankomunal?sslMode=REQUIRED&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ─── JWT ──────────────────────────
jwt.secret=${JWT_SECRET}

# ─── CORS ─────────────────────────────
# (el backend ya permite cualquier origen; esta variable queda lista
# por si más adelante se restringe a un dominio específico)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ─── Correo (opcional) ──────────────────
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# ─── URL del frontend (usada en los correos de recuperación) ─────
app.frontend-url=${FRONTEND_URL}

# ─── Respaldo y Recuperación ─────────────────────────
# En el contenedor Docker, mysqldump/mysql quedan instalados en el PATH
# (ver Dockerfile), así que basta con el nombre del ejecutable, sin ruta
# de Windows.
backup.mysqldump-path=mysqldump
backup.mysql-path=mysql
backup.directorio=${BACKUP_DIR:/app/backups}
backup.encryption-key=${BACKUP_ENCRYPTION_KEY:bankomunal-sena-2026}

# ─── Logging (menos ruido en producción) ─────────────
logging.level.com.bankomunal=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=WARN
